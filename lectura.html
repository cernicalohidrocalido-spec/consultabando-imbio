<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lectura — Consulta Pública IMBIO</title>
<meta name="theme-color" content="#002A5C" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul-marino:#002A5C; --azul-marino-claro:#0B3D75;
    --verde:#2f8f5b; --verde-oscuro:#1f6b42; --verde-claro:#e6f4ec;
    --azul:#0B3D75; --bg:#f4f6f8; --card:#ffffff;
    --texto:#1f2a24; --texto-sec:#3d4a43; --borde:#d8e0e8;
    --sombra:0 4px 18px rgba(0,42,92,.1);
    --toc-w:320px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--texto);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--azul-marino-claro);text-decoration:none}
  a:hover{text-decoration:underline}

  .topbar{
    background:linear-gradient(135deg,var(--azul-marino),var(--azul-marino-claro));
    color:#fff;padding:.7rem 1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.55rem 1rem;
    position:sticky;top:0;z-index:20;
  }
  .topbar .logo-ayto{
    height:40px;width:auto;border-radius:6px;background:#fff;padding:3px 6px;
  }
  .topbar a.volver{color:#fff;font-weight:600;font-size:.9rem}
  .topbar h1{margin:0;font-size:1.02rem;flex:1 1 180px;line-height:1.3;font-weight:700}
  .topbar .meta{font-size:.8rem;opacity:.9}
  .topbar a.pdf-doc,
  .topbar a.docx-doc{
    color:#fff;font-weight:600;font-size:.82rem;white-space:nowrap;
    background:rgba(255,255,255,.18);padding:.35rem .7rem;border-radius:999px;
    text-decoration:none;border:1px solid rgba(255,255,255,.28);
  }
  .topbar a.pdf-doc:hover,
  .topbar a.docx-doc:hover{background:rgba(255,255,255,.28);text-decoration:none}

  .layout{display:flex;align-items:flex-start;max-width:1200px;margin:0 auto}
  .toc{
    width:var(--toc-w);flex-shrink:0;position:sticky;top:3.5rem;
    max-height:calc(100vh - 4rem);overflow-y:auto;
    padding:1rem .75rem 2rem 1rem;border-right:1px solid var(--borde);
    background:var(--card);
  }
  .toc h2{margin:0 0 .6rem;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--azul-marino)}
  #buscaToc{
    width:100%;padding:.45rem .6rem;border:1px solid var(--borde);border-radius:8px;
    font-size:.85rem;background:var(--bg);color:var(--texto);margin-bottom:.35rem;
  }
  #buscaToc-hint{font-size:.72rem;color:#5a6b7a;margin:0 0 .5rem;min-height:1.1em}
  .toc-list{list-style:none;margin:0;padding:0;font-size:.82rem}
  .toc-list li{margin:0}
  .toc-list a{
    display:block;padding:.28rem .4rem;border-radius:6px;color:var(--texto-sec);
    line-height:1.35;
  }
  .toc-list a:hover,.toc-list a.activo{background:var(--verde-claro);color:var(--azul-marino);text-decoration:none}
  .toc-list a.oculto{display:none}
  .toc-list .toc-num{font-weight:700;color:var(--azul-marino)}
  .toc-list .toc-kw{
    display:block;font-size:.72rem;font-weight:500;color:#5a6b7a;
    margin-top:.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .toc-list a:hover .toc-kw,.toc-list a.activo .toc-kw{color:var(--azul-marino-claro)}

  .contenido{flex:1;min-width:0;padding:1.2rem 1.4rem 3rem;max-width:720px}
  .contenido .intro{color:var(--texto-sec);font-size:.9rem;margin:0 0 1.4rem}

  .articulo{
    margin-bottom:1.8rem;padding-bottom:1.2rem;border-bottom:1px solid var(--borde);
    scroll-margin-top:4rem;
  }
  .articulo:last-child{border-bottom:none}
  .articulo h3{
    margin:0 0 .65rem;font-size:1rem;color:var(--azul-marino);
    font-variant-numeric:tabular-nums;
  }
  .articulo .texto{font-size:.98rem;line-height:1.6}
  .articulo .texto-p{margin:0 0 .7rem}
  .articulo .seccion-titulo{
    margin:1rem 0 .45rem;font-weight:700;color:var(--azul-marino);font-size:.92rem;
    padding-top:.55rem;border-top:1px solid var(--borde);
  }
  .articulo .titulo-norma{
    margin:1.6rem 0 .6rem;font-weight:800;font-size:.95rem;letter-spacing:.03em;
    text-transform:uppercase;color:var(--azul-marino);padding-top:1rem;
    border-top:2px solid var(--azul-marino);line-height:1.35;
  }
  .articulo .capitulo-norma{
    margin:1.1rem 0 .55rem;font-weight:700;font-size:1rem;color:var(--azul-marino-claro);line-height:1.4;
  }
  .articulo .nota-editorial{
    margin:.85rem 0 .7rem;padding:.65rem .8rem;font-style:italic;font-size:.9rem;
    color:var(--texto-sec);background:var(--bg);border-left:3px solid var(--texto-sec);
    border-radius:0 8px 8px 0;line-height:1.5;
  }
  .articulo .btn-opinar{
    display:inline-block;margin-top:.75rem;padding:.4rem .75rem;font-size:.82rem;font-weight:600;
    color:var(--azul-marino);background:var(--verde-claro);border:1px solid var(--borde);
    border-radius:999px;text-decoration:none;cursor:pointer;font-family:inherit;
  }
  .articulo .btn-opinar:hover{background:var(--azul-marino);color:#fff;border-color:var(--azul-marino)}
  .articulo .btn-opinar[aria-expanded="true"]{
    background:var(--azul-marino-claro);color:#fff;border-color:var(--azul-marino-claro);
  }
  .origen-box{
    margin:.85rem 0 .35rem;padding:.7rem .85rem;border-radius:10px;
    background:#eef1f4;border:1px solid #d5dce0;border-left:3px solid #6b7c8c;
    color:var(--texto-sec);font-size:.86rem;line-height:1.45;
  }
  .origen-box .origen-label{margin:0 0 .35rem;color:#3d4a55;font-weight:600}
  .origen-box details{margin-top:.35rem}
  .origen-box summary{
    cursor:pointer;list-style:none;font-weight:600;color:var(--azul-marino);
    user-select:none;
  }
  .origen-box summary::-webkit-details-marker{display:none}
  .origen-box summary::after{content:" ▾";font-weight:400}
  .origen-box details[open] summary::after{content:" ▴"}
  .origen-box .origen-bloque{margin-top:.55rem;padding-top:.55rem;border-top:1px solid #d5dce0}
  .origen-box .origen-bloque:first-of-type{border-top:none;padding-top:.35rem}
  .origen-box .origen-bloque .cod-meta{
    font-size:.78rem;font-weight:700;color:var(--azul-marino);margin-bottom:.35rem;
  }
  .origen-box .origen-texto{font-size:.88rem;color:var(--texto);line-height:1.5}
  .origen-box a.pdf-codigo,
  .origen-box a.link-codigo{
    display:inline-block;margin-top:.55rem;margin-right:.85rem;font-size:.82rem;font-weight:600;
    color:var(--azul-marino);text-decoration:none;
  }
  .origen-box a.pdf-codigo:hover,
  .origen-box a.link-codigo:hover{text-decoration:underline}
  .origen-box .cod-meta a{
    color:inherit;text-decoration:underline;text-underline-offset:2px;
  }
  .form-panel{
    margin-top:.75rem;padding:.85rem;border:1px solid var(--borde);border-radius:12px;
    background:var(--card);box-shadow:var(--sombra);
  }
  .form-panel-hint{margin:0 0 .75rem;font-size:.82rem;color:var(--texto-sec)}
  .form-panel .ctx{
    margin:0 0 .85rem;padding:.55rem .7rem;font-size:.85rem;
    background:var(--verde-claro);border-radius:8px;color:var(--azul-marino);
  }
  .form-inline{display:grid;gap:.65rem}
  .form-inline label{font-size:.82rem;font-weight:600;color:var(--texto)}
  .form-inline input,.form-inline textarea{
    width:100%;padding:.55rem .65rem;border:1px solid var(--borde);border-radius:8px;
    font-size:.92rem;font-family:inherit;background:var(--bg);color:var(--texto);
  }
  .form-inline textarea{min-height:120px;resize:vertical}
  .form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
  .form-inline .hint{font-size:.75rem;color:var(--texto-sec);font-weight:400}
  .form-inline button[type="submit"]{
    margin-top:.25rem;padding:.65rem 1.1rem;background:var(--verde);color:#fff;
    border:none;border-radius:999px;font-weight:700;font-size:.92rem;cursor:pointer;
  }
  .form-inline button[type="submit"]:hover{background:var(--verde-oscuro)}
  .form-inline button[type="submit"]:disabled{opacity:.65;cursor:wait}
  .form-ok{
    padding:.85rem;background:var(--verde-claro);border-radius:10px;
    color:var(--azul-marino);font-size:.92rem;
  }
  .form-err{
    margin-top:.5rem;padding:.65rem .75rem;background:#fff3f0;border-radius:8px;
    color:#8a2b1a;font-size:.85rem;border:1px solid #f0c2b8;
  }
  .articulo .fracciones,.articulo .incisos,.articulo .subincisos{
    margin:.35rem 0 .8rem;padding:0;list-style:none;
  }
  .articulo .fracciones > li{
    margin:.45rem 0;padding:.55rem .75rem;border-left:3px solid var(--verde);
    background:var(--bg);border-radius:0 8px 8px 0;
  }
  .articulo .incisos{
    margin:.4rem 0 .15rem .15rem;
  }
  .articulo .incisos > li{
    margin:.28rem 0;padding:.4rem .65rem;border:1px solid var(--borde);
    border-left:3px solid var(--azul);border-radius:0 8px 8px 0;background:#fff;
  }
  .articulo .subincisos{
    margin:.35rem 0 .1rem .35rem;
  }
  .articulo .subincisos > li{
    margin:.2rem 0;padding:.3rem .55rem;
    border-left:2px solid #8aa4bf;border-radius:0 6px 6px 0;
    background:transparent;font-size:.95rem;
  }
  .articulo .num{font-weight:700;color:var(--azul-marino);margin-right:.3rem}

  .articulo.resaltado{background:var(--verde-claro);margin-left:-.6rem;margin-right:-.6rem;padding:.6rem;border-radius:10px}
  .articulo.oculto{display:none}

  .error{padding:2rem;text-align:center;color:var(--texto-sec)}
  .cargando{padding:2rem;text-align:center;color:var(--texto-sec)}

  /* Mientras se carga un enlace profundo (#art-N), ocultar el layout para no
     mostrar el scroll desde el inicio del documento hasta el artículo. */
  html.esperando-ancla{overflow:hidden}
  html.esperando-ancla .layout{opacity:0;pointer-events:none}
  html.esperando-ancla .topbar .meta::after{content:" · ubicando artículo…";opacity:.9}

  .toc-toggle{
    display:none;margin-left:auto;background:rgba(255,255,255,.2);border:none;color:#fff;
    padding:.4rem .75rem;border-radius:8px;cursor:pointer;font-size:.85rem;
  }

  @media (max-width:768px){
    .layout{flex-direction:column}
    .toc{
      width:100%;position:relative;top:0;max-height:none;border-right:none;
      border-bottom:1px solid var(--borde);display:none;
    }
    .toc.abierto{display:block}
    .toc-toggle{display:block}
    .contenido{padding:1rem}
  }
</style>
</head>

<header class="topbar">

<script src="js/formato-legal.js?v=listas2"></script>
<script>
const OBSERVACIONES_URL = "https://observaciones.imbio.info/enviar";
const BTN_OPINAR = "💬 Opinar sobre este artículo";

const CATALOGO = {
  codigo: {
    titulo: "Código Municipal 2024",
    color: "#5a6b7a",
    pdf: "pdfs/Codigo_Municipal_v2024.pdf",
    docx: "docx/Codigo_Municipal_v2024.docx",
    fuente: "data/codigo_municipal.json?v=lecturaCodigo2",
    soloConsulta: true,
    nombreLegal: "Código Municipal de Pabellón de Arteaga (versión 2024)",
  },
  bando: { titulo: "Bando de Policía y Buen Gobierno", color: "#2f8f5b", pdf: "pdfs/Bando_Policia_Buen_Gobierno_Pabellon.pdf", docx: "docx/Bando_Policia_Buen_Gobierno_Pabellon.docx" },
  actos: { titulo: "Actos y Procedimientos Administrativos", color: "#2f8f5b", pdf: "pdfs/Reglamento_Actos_Procedimientos_Administrativos_Pabellon.pdf", docx: "docx/Reglamento_Actos_Procedimientos_Administrativos_Pabellon.docx" },
  seguridad: { titulo: "Seguridad Pública y Movilidad", color: "#2e6ea6", pdf: "pdfs/Reglamento_Seguridad_Publica_Movilidad_Pabellon.pdf", docx: "docx/Reglamento_Seguridad_Publica_Movilidad_Pabellon.docx" },
  urbano: { titulo: "Desarrollo Urbano", color: "#c1622a", pdf: "pdfs/Reglamento_Desarrollo_Urbano_Pabellon.pdf", docx: "docx/Reglamento_Desarrollo_Urbano_Pabellon.docx" },
  gobierno: { titulo: "Gobierno Interior", color: "#2f8f5b", pdf: "pdfs/Reglamento_Gobierno_Interior_Pabellon.pdf", docx: "docx/Reglamento_Gobierno_Interior_Pabellon.docx" },
  patrimonio: { titulo: "Patrimonio Municipal", color: "#c1622a", pdf: "pdfs/Reglamento_Patrimonio_Municipal_Pabellon.pdf", docx: "docx/Reglamento_Patrimonio_Municipal_Pabellon.docx" },
  biodiversidad: { titulo: "Biodiversidad y Protección Ambiental", color: "#1f6b42", pdf: "pdfs/Reglamento_Biodiversidad_Ambiental_Animal_Pabellon.pdf", docx: "docx/Reglamento_Biodiversidad_Ambiental_Animal_Pabellon.docx" },
  comercio: { titulo: "Comercio", color: "#f4b400", pdf: "pdfs/Reglamento_Comercio_Via_Publica_Pabellon.pdf", docx: "docx/Reglamento_Comercio_Via_Publica_Pabellon.docx" },
  espectaculos: { titulo: "Espectáculos y Diversiones Públicas", color: "#f4b400", pdf: "pdfs/Reglamento_Espectaculos_Festejos_Pabellon.pdf", docx: "docx/Reglamento_Espectaculos_Festejos_Pabellon.docx" },
  capapa: { titulo: "Comisión de Agua Potable y Alcantarillado (CAPAPA)", color: "#2e6ea6", pdf: "pdfs/Reglamento_CAPAPA_Pabellon.pdf", docx: "docx/Reglamento_CAPAPA_Pabellon.docx" },
  servicios: { titulo: "Servicios Públicos Municipales", color: "#2f8f5b", pdf: "pdfs/Reglamento_Servicios_Publicos_Pabellon.pdf", docx: "docx/Reglamento_Servicios_Publicos_Pabellon.docx" },
  trabajo: { titulo: "Condiciones de Trabajo", color: "#2f8f5b", pdf: "pdfs/Reglamento_Condiciones_Trabajo_Pabellon.pdf", docx: "docx/Reglamento_Condiciones_Trabajo_Pabellon.docx" },
};

const params = new URLSearchParams(location.search);
const docId = params.get("doc") || "";
const hashInicial = location.hash.replace(/^#art-/, "");
if (hashInicial) {
  try { history.scrollRestoration = "manual"; } catch (_) {}
  document.documentElement.classList.add("esperando-ancla");
}

function irAlArticulo(slug, { revelar = false } = {}) {
  const el = document.getElementById("art-" + slug);
  if (!el) {
    if (revelar) document.documentElement.classList.remove("esperando-ancla");
    return false;
  }
  const topbar = document.querySelector(".topbar");
  const offset = (topbar ? topbar.offsetHeight : 0) + 8;
  const y = el.getBoundingClientRect().top + window.pageYOffset - offset;
  window.scrollTo(0, Math.max(0, y));
  if (revelar) {
    // Esperar un frame de layout para que el scroll ya esté aplicado al revelar.
    requestAnimationFrame(() => {
      document.documentElement.classList.remove("esperando-ancla");
    });
  }
  return true;
}
function numArticulo(a) {
  const raw = String(a.articulo || "");
  const m = raw.match(/^(\d+(?:[.,]\d+)?)/);
  const n = m ? parseFloat(m[1].replace(",", ".")) : NaN;
  return Number.isFinite(n) ? n : 999999;
}

function slugArt(n) {
  return String(n).replace(/[^\w.-]+/g, "-");
}

function textoCodigoLimpio(texto) {
  return String(texto || "").replace(/^\s*º\s*[.-]\s*/i, "").replace(/^\s*[.-]\s*/, "");
}

function hrefCodigoArt(num) {
  return `lectura.html?doc=codigo#art-${encodeURIComponent(slugArt(num))}`;
}

function normaliza(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

/** Stopwords / ruido legal para palabras clave del índice (2–3 palabras). */
const TOC_STOP = new Set([
  "las","los","del","que","por","para","con","una","uno","unos","unas","este","esta","estos","estas",
  "como","asi","son","ser","sus","su","al","el","la","de","en","y","o","u","e","se","es","lo","le","les",
  "un","mi","tu","si","ya","muy","mas","tan","todo","toda","todos","todas","tanto","tambien","ademas",
  "segun","mismo","misma","mismos","mismas","dicho","dicha","dichos","dichas","presente","municipio",
  "codigo","articulo","fraccion","conforme","mediante","debera","deberan","podra","podran","sera","seran",
  "cuando","donde","quien","quienes","respecto","entre","sobre","bajo","ante","desde","hasta","hacia",
  "durante","sin","tras","cada","cual","cuales","cuyo","cuya","cuyos","cuyas","aquellos","aquellas",
  "aquel","aquella","habra","habran","haya","hayan","sea","sean","fue","fueron","sido","siendo","estar",
  "estan","estara","debe","deben","puede","pueden","tienen","tiene","tendra","tendran","publico","interes",
  "general","aplicacion","obligatorias","ciudadanos","tengan","domicilio","esten","paso","reglamentarias",
  "politica","estados","unidos","mexicanos","constitucion","estado","aguascalientes","leyes","regulan",
  "actividad","municipal","demas","relativos","ley","siguiente","siguientes","preferentemente","sujetaran",
  "corresponderan","integran","integrara","ningun","motivo","traves","cualquiera","anterior","posterior",
  "referido","referida","inciso","incisos","numeral","numerales","fracciones","parrafo","parrafos",
  "caso","casos","efecto","efectos","terminos","termino","disposicion","disposiciones",
].map((w) => normaliza(w)));

/** Genera 2–3 palabras clave a partir del inicio del artículo (solo para el índice). */
function resumenArticulo(texto) {
  let t = String(texto || "")
    .replace(/^º\.?[-–—.]?\s*/i, "")
    .replace(/^Artículo\s+\d+[°º.]?\s*[-–—.]?\s*/i, "")
    .replace(/\s+/g, " ")
    .trim();

  const mLista = t.match(
    /^(.{8,100}?)\s+se\s+sujetar[aá]n\s+preferentemente\s+al\s+orden\s+siguiente/i
  );
  if (mLista) {
    const subj = (mLista[1].match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+/g) || []).filter((w) => {
      const n = normaliza(w);
      return n.length >= 3 && !TOC_STOP.has(n);
    });
    if (subj.length) return ("orden " + subj.slice(0, 2).join(" ")).trim();
  }

  const pool = [];
  for (const chunk of t.split(/[.;]/).filter(Boolean).slice(0, 4)) {
    const words = chunk.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9]+/g) || [];
    for (const w of words) {
      const n = normaliza(w);
      if (n.length < 4 || TOC_STOP.has(n) || /^\d+$/.test(n)) continue;
      if (pool.some((p) => normaliza(p) === n)) continue;
      pool.push(w);
      if (pool.length >= 3) break;
    }
    if (pool.length >= 3) break;
  }
  return pool.slice(0, 3).join(" ");
}

function renderError(msg) {
  document.getElementById("tituloDoc").textContent = "Reglamento no encontrado";
  document.getElementById("contenido").innerHTML = `<div class="error">${msg}<br><br><a href="index.html">← Volver al inicio</a></div>`;
  document.getElementById("panelToc").style.display = "none";
}

function notaEditorialHtml(a) {
  const nota = String(a.nota_editorial || "").trim();
  if (!nota) return "";
  return `<p class="nota-editorial">${escapeHtml(nota)}</p>`;
}

function origenHtml(a) {
  const origenDirecto = Array.isArray(a.origen) ? a.origen : [];
  const origenTematico = Array.isArray(a.origen_tematico) ? a.origen_tematico : [];
  // Bando usa origen_tematico; el resto usa origen. Preferir origen si hay ambos.
  const origen = origenDirecto.length ? origenDirecto : origenTematico;
  if (origen.length === 0) return "";

  const nums = origen.map((o) => escapeHtml(String(o.articulo_codigo)));
  let listaNums;
  if (nums.length === 1) listaNums = `Artículo ${nums[0]}`;
  else if (nums.length === 2) listaNums = `Artículos ${nums[0]} y ${nums[1]}`;
  else listaNums = `Artículos ${nums.slice(0, -1).join(", ")} y ${nums[nums.length - 1]}`;

  const bloques = origen.map((o) => {
    const num = String(o.articulo_codigo);
    const href = hrefCodigoArt(num);
    return `
      <div class="origen-bloque">
        <div class="cod-meta"><a href="${href}" target="_blank" rel="noopener">Código Municipal 2024 — Artículo ${escapeHtml(num)}</a></div>
        <div class="origen-texto">${formatTextoLegal(o.texto || "")}</div>
        <a class="link-codigo" href="${href}" target="_blank" rel="noopener">Consultar artículo ${escapeHtml(num)} en el Código →</a>
      </div>`;
  }).join("");

  const primero = String(origen[0].articulo_codigo);
  const hrefPrimero = hrefCodigoArt(primero);

  return `<aside class="origen-box">
      <p class="origen-label">📜 Origen: Código Municipal 2024, ${listaNums}</p>
      <details>
        <summary>Ver texto original</summary>
        ${bloques}
      </details>
      <a class="link-codigo" href="${hrefPrimero}" target="_blank" rel="noopener">Consultar en el Código (HTML) →</a>
      <a class="pdf-codigo" href="pdfs/Codigo_Municipal_v2024.pdf" target="_blank" rel="noopener">Ver PDF completo del Código →</a>
    </aside>`;
}

function formPanelHtml(a) {
  const id = a._slug || slugArt(a.articulo);
  const artVal = escapeHtml(String(a.articulo));
  return `<div class="form-panel" hidden>
    <p class="form-panel-hint">Tu observación se envía al IMBIO y queda ligada a este artículo.</p>
    <p class="ctx"><strong>${escapeHtml(a.reglamento)}</strong> · Artículo ${artVal}</p>
    <div class="form-ok" hidden>Gracias. Tu observación fue enviada y será revisada por el IMBIO.</div>
    <form class="form-inline" data-art-form="${id}" data-reglamento="${escapeHtml(a.reglamento)}" data-articulo="${artVal}">
      <div>
        <label for="nombre_${id}">Nombre <span class="hint">(opcional)</span></label>
        <input type="text" id="nombre_${id}" name="nombre" autocomplete="name" maxlength="200" />
      </div>
      <div>
        <label for="contacto_${id}">Contacto <span class="hint">(correo o teléfono, opcional)</span></label>
        <input type="text" id="contacto_${id}" name="contacto" autocomplete="email" maxlength="200" />
      </div>
      <div>
        <label for="msg_${id}">Tu duda, comentario u observación</label>
        <textarea id="msg_${id}" name="comentario" required maxlength="5000" placeholder="Escribe aquí tu observación sobre este artículo…"></textarea>
      </div>
      <button type="submit">Enviar observación</button>
      <div class="form-err" hidden></div>
    </form>
  </div>`;
}

function toggleFormPanel(btn) {
  const art = btn.closest(".articulo");
  const panel = art.querySelector(".form-panel");
  const abierto = btn.getAttribute("aria-expanded") === "true";

  document.querySelectorAll(".articulo .form-panel").forEach((p) => {
    if (p !== panel) {
      p.hidden = true;
      const ok = p.querySelector(".form-ok");
      const f = p.querySelector(".form-inline");
      const err = p.querySelector(".form-err");
      if (ok && f) { ok.hidden = true; f.hidden = false; }
      if (err) { err.hidden = true; err.textContent = ""; }
    }
  });
  document.querySelectorAll(".articulo .btn-opinar").forEach((b) => {
    if (b !== btn) {
      b.setAttribute("aria-expanded", "false");
      b.textContent = BTN_OPINAR;
    }
  });

  if (abierto) {
    panel.hidden = true;
    btn.setAttribute("aria-expanded", "false");
    btn.textContent = BTN_OPINAR;
    return;
  }

  panel.hidden = false;
  btn.setAttribute("aria-expanded", "true");
  btn.textContent = "Ocultar formulario";
  setTimeout(() => panel.scrollIntoView({ behavior: "smooth", block: "nearest" }), 80);
}

async function onFormSubmit(e) {
  e.preventDefault();
  const form = e.target.closest(".form-inline");
  if (!form) return;
  const panel = form.closest(".form-panel");
  const err = form.querySelector(".form-err");
  const btn = form.querySelector('button[type="submit"]');
  const comentario = (form.querySelector('[name="comentario"]')?.value || "").trim();
  err.hidden = true;
  err.textContent = "";
  if (!comentario) {
    err.hidden = false;
    err.textContent = "Escribe tu duda, comentario u observación antes de enviar.";
    return;
  }
  const payload = {
    nombre: (form.querySelector('[name="nombre"]')?.value || "").trim(),
    contacto: (form.querySelector('[name="contacto"]')?.value || "").trim(),
    reglamento: form.dataset.reglamento || "",
    articulo: form.dataset.articulo || "",
    comentario,
  };
  btn.disabled = true;
  try {
    const resp = await fetch(OBSERVACIONES_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || !data.ok) throw new Error(data.error || "Error");
    form.hidden = true;
    panel.querySelector(".form-ok").hidden = false;
    panel.querySelector(".form-panel-hint").hidden = true;
    panel.querySelector(".ctx").hidden = true;
    panel.querySelector(".form-ok").textContent = data.mensaje || "Gracias, tu observación fue recibida.";
  } catch {
    err.hidden = false;
    err.textContent = "No pudimos enviar tu observación. Revisa tu conexión e intenta de nuevo en un momento.";
    btn.disabled = false;
  }
}

async function init() {
  const cat = CATALOGO[docId];
  if (!cat) {
    renderError("No se reconoce el documento solicitado. Elige un reglamento desde la página principal.");
    return;
  }

  const soloConsulta = !!cat.soloConsulta;

  document.getElementById("tituloDoc").textContent = cat.titulo;
  document.title = `${cat.titulo} — Lectura | IMBIO`;
  document.querySelector(".topbar").style.borderBottom = `3px solid ${cat.color}`;
  const linkPdf = document.getElementById("linkPdf");
  const linkDocx = document.getElementById("linkDocx");
  if (cat.pdf) {
    linkPdf.href = cat.pdf;
    linkPdf.hidden = false;
  } else {
    linkPdf.hidden = true;
  }
  if (cat.docx) {
    linkDocx.href = cat.docx;
    linkDocx.hidden = false;
  } else {
    linkDocx.hidden = true;
  }

  let arts;
  try {
    if (cat.fuente) {
      const r = await fetch(cat.fuente);
      const raw = await r.json();
      arts = raw.map((a, i) => ({
        articulo: a.articulo,
        texto: textoCodigoLimpio(a.texto),
        reglamento: cat.nombreLegal || cat.titulo,
        _idx: i,
      })).sort((a, b) => numArticulo(a) - numArticulo(b) || a._idx - b._idx);
    } else {
      const r = await fetch("data/articulos.json?v=notasEd1");
      const todos = await r.json();
      arts = todos.filter((a) => a.doc === docId).sort((a, b) => numArticulo(a) - numArticulo(b));
    }
  } catch {
    renderError(cat.fuente
      ? "No pude cargar el Código Municipal (data/codigo_municipal.json)."
      : "No pude cargar el índice de artículos (data/articulos.json).");
    return;
  }

  if (arts.length === 0) {
    renderError("Este documento no tiene artículos en el índice.");
    return;
  }

  // IDs únicos (el Código tiene algunos números repetidos en el JSON fuente)
  const slugCount = Object.create(null);
  arts.forEach((a) => {
    const base = slugArt(a.articulo);
    const n = (slugCount[base] || 0) + 1;
    slugCount[base] = n;
    a._slug = n === 1 ? base : `${base}-${n}`;
  });

  const nombreLegal = cat.nombreLegal || arts[0].reglamento;
  document.getElementById("metaDoc").textContent = soloConsulta
    ? `${arts.length} artículos · solo consulta`
    : `${arts.length} artículos · texto oficial`;

  const toc = document.getElementById("tocList");
  const cuerpo = document.getElementById("contenido");

  toc.innerHTML = arts.map((a) => {
    const kw = resumenArticulo(a.texto);
    a._kw = kw;
    a._normNum = normaliza(String(a.articulo));
    a._normKw = normaliza(kw);
    a._normText = normaliza(a.texto);
    const kwHtml = kw
      ? `<span class="toc-kw">${escapeHtml(kw)}</span>`
      : "";
    return `<li><a href="#art-${a._slug}" data-art="${a._slug}" data-kw="${escapeHtml(kw)}" title="${escapeHtml(kw || ("Artículo " + a.articulo))}"><span class="toc-num">Artículo ${escapeHtml(String(a.articulo))}</span>${kwHtml}</a></li>`;
  }).join("");

  const tocLinks = Array.from(toc.querySelectorAll("a"));
  const buscaHint = document.getElementById("buscaToc-hint");
  let buscaTimer = null;

  function articuloCoincide(a, q) {
    if (!q) return true;
    if (/^\d+$/.test(q)) {
      return a._normNum === q || a._normNum.startsWith(q);
    }
    return a._normNum.includes(q) || a._normKw.includes(q) || a._normText.includes(q);
  }

  function filtrarIndice(qRaw) {
    const q = normaliza(String(qRaw || "").trim());
    let visibles = 0;
    let primero = null;
    for (let i = 0; i < arts.length; i++) {
      const match = articuloCoincide(arts[i], q);
      tocLinks[i].classList.toggle("oculto", !match);
      if (match) {
        visibles++;
        if (!primero) primero = tocLinks[i];
      }
    }
    if (!q) {
      buscaHint.textContent = "";
    } else if (visibles === 0) {
      buscaHint.textContent = "Sin resultados. Prueba otro número o palabra.";
    } else {
      buscaHint.textContent = visibles === 1
        ? "1 artículo encontrado"
        : `${visibles} artículos encontrados`;
    }
    return primero;
  }

  const buscaInput = document.getElementById("buscaToc");
  buscaInput.addEventListener("input", (e) => {
    const val = e.target.value;
    if (buscaTimer) clearTimeout(buscaTimer);
    buscaTimer = setTimeout(() => { filtrarIndice(val); }, 220);
  });
  buscaInput.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (buscaTimer) {
      clearTimeout(buscaTimer);
      buscaTimer = null;
    }
    const primero = filtrarIndice(buscaInput.value);
    if (primero) primero.click();
  });

  const intro = soloConsulta
    ? `<p class="intro"><strong>${escapeHtml(nombreLegal)}</strong> — lectura de consulta del ordenamiento vigente. El texto no se altera; las observaciones sobre la reforma se envían desde el Bando y los reglamentos derivados.</p>`
    : `<p class="intro"><strong>${escapeHtml(nombreLegal)}</strong> — lectura continua con índice. El texto proviene del paquete normativo en consulta pública; no se ha alterado.</p>`;

  cuerpo.innerHTML = `
    ${intro}
    ${arts.map((a) => {
      const id = a._slug;
      const extras = soloConsulta
        ? ""
        : `${origenHtml(a)}
        <button type="button" class="btn-opinar" aria-expanded="false">${BTN_OPINAR}</button>
        ${formPanelHtml(a)}`;
      return `<article class="articulo" id="art-${id}" data-art="${id}">
        <h3>Artículo ${escapeHtml(String(a.articulo))}</h3>
        ${notaEditorialHtml(a)}
        <div class="texto">${formatTextoLegal(a.texto)}</div>
        ${extras}
      </article>`;
    }).join("")}
  `;

  if (!soloConsulta) {
    cuerpo.addEventListener("click", (e) => {
      const btn = e.target.closest(".btn-opinar");
      if (btn) toggleFormPanel(btn);
    });
    cuerpo.addEventListener("submit", onFormSubmit);
  }

  function scrollToHash(revelar) {
    const hash = location.hash.replace(/^#art-/, "");
    if (!hash) {
      if (revelar) document.documentElement.classList.remove("esperando-ancla");
      return;
    }
    irAlArticulo(hash, { revelar: !!revelar });
  }
  // Salto instantáneo (sin animación) y revelar solo cuando ya estamos en el artículo.
  scrollToHash(true);
  window.addEventListener("hashchange", () => scrollToHash(false));

  document.getElementById("btnToc").addEventListener("click", () => {
    const panel = document.getElementById("panelToc");
    const open = panel.classList.toggle("abierto");
    document.getElementById("btnToc").setAttribute("aria-expanded", open);
  });

  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) {
          const id = en.target.dataset.art;
          toc.querySelectorAll("a").forEach((a) => a.classList.toggle("activo", a.dataset.art === id));
        }
      });
    },
    { rootMargin: "-20% 0px -70% 0px", threshold: 0 }
  );
  cuerpo.querySelectorAll(".articulo").forEach((el) => observer.observe(el));
}

init();
</script>
