<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lectura — Consulta Pública IMBIO</title>
<meta name="theme-color" content="#002A5C" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul-marino:#002A5C; --azul-marino-claro:#0B3D75;
    --verde:#2f8f5b; --verde-oscuro:#1f6b42; --verde-claro:#e6f4ec;
    --azul:#0B3D75; --bg:#f4f6f8; --card:#ffffff;
    --texto:#1f2a24; --texto-sec:#3d4a43; --borde:#d8e0e8;
    --sombra:0 4px 18px rgba(0,42,92,.1);
    --toc-w:280px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--texto);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--azul-marino-claro);text-decoration:none}
  a:hover{text-decoration:underline}

  .topbar{
    background:linear-gradient(135deg,var(--azul-marino),var(--azul-marino-claro));
    color:#fff;padding:.7rem 1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.55rem 1rem;
    position:sticky;top:0;z-index:20;
  }
  .topbar .logo-ayto{
    height:40px;width:auto;border-radius:6px;background:#fff;padding:3px 6px;
  }
  .topbar a.volver{color:#fff;font-weight:600;font-size:.9rem}
  .topbar h1{margin:0;font-size:1.02rem;flex:1 1 180px;line-height:1.3;font-weight:700}
  .topbar .meta{font-size:.8rem;opacity:.9}
  .topbar a.pdf-doc{
    color:#fff;font-weight:600;font-size:.82rem;white-space:nowrap;
    background:rgba(255,255,255,.18);padding:.35rem .7rem;border-radius:999px;
    text-decoration:none;border:1px solid rgba(255,255,255,.28);
  }
  .topbar a.pdf-doc:hover{background:rgba(255,255,255,.28);text-decoration:none}

  .layout{display:flex;align-items:flex-start;max-width:1200px;margin:0 auto}
  .toc{
    width:var(--toc-w);flex-shrink:0;position:sticky;top:3.5rem;
    max-height:calc(100vh - 4rem);overflow-y:auto;
    padding:1rem .75rem 2rem 1rem;border-right:1px solid var(--borde);
    background:var(--card);
  }
  .toc h2{margin:0 0 .6rem;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--azul-marino)}
  #buscaToc{
    width:100%;padding:.45rem .6rem;border:1px solid var(--borde);border-radius:8px;
    font-size:.85rem;background:var(--bg);color:var(--texto);margin-bottom:.6rem;
  }
  .toc-list{list-style:none;margin:0;padding:0;font-size:.82rem}
  .toc-list li{margin:0}
  .toc-list a{
    display:block;padding:.28rem .4rem;border-radius:6px;color:var(--texto-sec);
  }
  .toc-list a:hover,.toc-list a.activo{background:var(--verde-claro);color:var(--azul-marino);text-decoration:none}
  .toc-list a.oculto{display:none}

  .contenido{flex:1;min-width:0;padding:1.2rem 1.4rem 3rem;max-width:720px}
  .contenido .intro{color:var(--texto-sec);font-size:.9rem;margin:0 0 1.4rem}

  .articulo{
    margin-bottom:1.8rem;padding-bottom:1.2rem;border-bottom:1px solid var(--borde);
    scroll-margin-top:4rem;
  }
  .articulo:last-child{border-bottom:none}
  .articulo h3{
    margin:0 0 .65rem;font-size:1rem;color:var(--azul-marino);
    font-variant-numeric:tabular-nums;
  }
  .articulo .texto{font-size:.98rem;line-height:1.6}
  .articulo .texto-p{margin:0 0 .7rem}
  .articulo .seccion-titulo{
    margin:1rem 0 .45rem;font-weight:700;color:var(--azul-marino);font-size:.92rem;
    padding-top:.55rem;border-top:1px solid var(--borde);
  }
  .articulo .titulo-norma{
    margin:1.6rem 0 .6rem;font-weight:800;font-size:.95rem;letter-spacing:.03em;
    text-transform:uppercase;color:var(--azul-marino);padding-top:1rem;
    border-top:2px solid var(--azul-marino);line-height:1.35;
  }
  .articulo .capitulo-norma{
    margin:1.1rem 0 .55rem;font-weight:700;font-size:1rem;color:var(--azul-marino-claro);line-height:1.4;
  }
  .articulo .nota-editorial{
    margin:.85rem 0 .7rem;padding:.65rem .8rem;font-style:italic;font-size:.9rem;
    color:var(--texto-sec);background:var(--bg);border-left:3px solid var(--texto-sec);
    border-radius:0 8px 8px 0;line-height:1.5;
  }
  .articulo .btn-opinar{
    display:inline-block;margin-top:.75rem;padding:.4rem .75rem;font-size:.82rem;font-weight:600;
    color:var(--azul-marino);background:var(--verde-claro);border:1px solid var(--borde);
    border-radius:999px;text-decoration:none;cursor:pointer;font-family:inherit;
  }
  .articulo .btn-opinar:hover{background:var(--azul-marino);color:#fff;border-color:var(--azul-marino)}
  .articulo .btn-opinar[aria-expanded="true"]{
    background:var(--azul-marino-claro);color:#fff;border-color:var(--azul-marino-claro);
  }
  .origen-box{
    margin:.85rem 0 .35rem;padding:.7rem .85rem;border-radius:10px;
    background:#eef1f4;border:1px solid #d5dce0;border-left:3px solid #6b7c8c;
    color:var(--texto-sec);font-size:.86rem;line-height:1.45;
  }
  .origen-box .origen-label{margin:0 0 .35rem;color:#3d4a55;font-weight:600}
  .origen-box details{margin-top:.35rem}
  .origen-box summary{
    cursor:pointer;list-style:none;font-weight:600;color:var(--azul-marino);
    user-select:none;
  }
  .origen-box summary::-webkit-details-marker{display:none}
  .origen-box summary::after{content:" ▾";font-weight:400}
  .origen-box details[open] summary::after{content:" ▴"}
  .origen-box .origen-bloque{margin-top:.55rem;padding-top:.55rem;border-top:1px solid #d5dce0}
  .origen-box .origen-bloque:first-of-type{border-top:none;padding-top:.35rem}
  .origen-box .origen-bloque .cod-meta{
    font-size:.78rem;font-weight:700;color:var(--azul-marino);margin-bottom:.35rem;
  }
  .origen-box .origen-texto{font-size:.88rem;color:var(--texto);line-height:1.5}
  .origen-box a.pdf-codigo{
    display:inline-block;margin-top:.55rem;font-size:.82rem;font-weight:600;
    color:var(--azul-marino);text-decoration:none;
  }
  .origen-box a.pdf-codigo:hover{text-decoration:underline}
  .form-panel{
    margin-top:.75rem;padding:.85rem;border:1px solid var(--borde);border-radius:12px;
    background:var(--card);box-shadow:var(--sombra);
  }
  .form-panel-hint{margin:0 0 .75rem;font-size:.82rem;color:var(--texto-sec)}
  .form-panel .ctx{
    margin:0 0 .85rem;padding:.55rem .7rem;font-size:.85rem;
    background:var(--verde-claro);border-radius:8px;color:var(--azul-marino);
  }
  .form-inline{display:grid;gap:.65rem}
  .form-inline label{font-size:.82rem;font-weight:600;color:var(--texto)}
  .form-inline input,.form-inline textarea{
    width:100%;padding:.55rem .65rem;border:1px solid var(--borde);border-radius:8px;
    font-size:.92rem;font-family:inherit;background:var(--bg);color:var(--texto);
  }
  .form-inline textarea{min-height:120px;resize:vertical}
  .form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
  .form-inline .hint{font-size:.75rem;color:var(--texto-sec);font-weight:400}
  .form-inline button[type="submit"]{
    margin-top:.25rem;padding:.65rem 1.1rem;background:var(--verde);color:#fff;
    border:none;border-radius:999px;font-weight:700;font-size:.92rem;cursor:pointer;
  }
  .form-inline button[type="submit"]:hover{background:var(--verde-oscuro)}
  .form-inline button[type="submit"]:disabled{opacity:.65;cursor:wait}
  .form-ok{
    padding:.85rem;background:var(--verde-claro);border-radius:10px;
    color:var(--azul-marino);font-size:.92rem;
  }
  .form-err{
    margin-top:.5rem;padding:.65rem .75rem;background:#fff3f0;border-radius:8px;
    color:#8a2b1a;font-size:.85rem;border:1px solid #f0c2b8;
  }
  .articulo .fracciones,.articulo .incisos{margin:.35rem 0 .8rem;padding:0;list-style:none}
  .articulo .fracciones li{
    margin:.4rem 0;padding:.5rem .7rem;border-left:3px solid var(--verde);
    background:var(--bg);border-radius:0 8px 8px 0;
  }
  .articulo .incisos li{
    margin:.3rem 0;padding:.4rem .65rem;border:1px solid var(--borde);
    border-left:3px solid var(--azul);border-radius:0 8px 8px 0;
  }
  .articulo .num{font-weight:700;color:var(--azul-marino);margin-right:.3rem}

  .articulo.resaltado{background:var(--verde-claro);margin-left:-.6rem;margin-right:-.6rem;padding:.6rem;border-radius:10px}
  .articulo.oculto{display:none}

  .error{padding:2rem;text-align:center;color:var(--texto-sec)}
  .cargando{padding:2rem;text-align:center;color:var(--texto-sec)}

  .toc-toggle{
    display:none;margin-left:auto;background:rgba(255,255,255,.2);border:none;color:#fff;
    padding:.4rem .75rem;border-radius:8px;cursor:pointer;font-size:.85rem;
  }

  @media (max-width:768px){
    .layout{flex-direction:column}
    .toc{
      width:100%;position:relative;top:0;max-height:none;border-right:none;
      border-bottom:1px solid var(--borde);display:none;
    }
    .toc.abierto{display:block}
    .toc-toggle{display:block}
    .contenido{padding:1rem}
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="volver" href="index.html">← Volver</a>
  <img class="logo-ayto" src="logo_ayuntamiento.jpg" alt="Ayuntamiento" width="120" height="40" />
  <h1 id="tituloDoc">Cargando…</h1>
  <span class="meta" id="metaDoc"></span>
  <a class="pdf-doc" id="linkPdf" href="#" target="_blank" rel="noopener" hidden>📄 Descargar PDF</a>
  <button type="button" class="toc-toggle" id="btnToc" aria-expanded="false">Índice</button>
</header>

<div class="layout">
  <aside class="toc" id="panelToc" aria-label="Índice de artículos">
    <h2>Índice</h2>
    <input type="search" id="buscaToc" placeholder="Buscar artículo o texto…" autocomplete="off" />
    <ol class="toc-list" id="tocList"></ol>
  </aside>
  <main class="contenido" id="contenido">
    <p class="cargando">Cargando reglamento…</p>
  </main>
</div>

<script src="js/formato-legal.js"></script>
<script>
const OBSERVACIONES_URL = "https://observaciones.imbio.info/enviar";
const BTN_OPINAR = "💬 Opinar sobre este artículo";

const CATALOGO = {
  bando: { titulo: "Bando de Policía y Buen Gobierno", color: "#2f8f5b", pdf: "pdfs/Bando_Policia_Buen_Gobierno_Pabellon.pdf" },
  actos: { titulo: "Actos y Procedimientos Administrativos", color: "#2f8f5b", pdf: "pdfs/Reglamento_Actos_Procedimientos_Administrativos_Pabellon.pdf" },
  seguridad: { titulo: "Seguridad Pública y Movilidad", color: "#2e6ea6", pdf: "pdfs/Reglamento_Seguridad_Publica_Movilidad_Pabellon.pdf" },
  urbano: { titulo: "Desarrollo Urbano", color: "#c1622a", pdf: "pdfs/Reglamento_Desarrollo_Urbano_Pabellon.pdf" },
  gobierno: { titulo: "Gobierno Interior", color: "#2f8f5b", pdf: "pdfs/Reglamento_Gobierno_Interior_Pabellon.pdf" },
  patrimonio: { titulo: "Patrimonio Municipal", color: "#c1622a", pdf: "pdfs/Reglamento_Patrimonio_Municipal_Pabellon.pdf" },
  biodiversidad: { titulo: "Biodiversidad y Protección Ambiental", color: "#1f6b42", pdf: "pdfs/Reglamento_Biodiversidad_Ambiental_Animal_Pabellon.pdf" },
  comercio: { titulo: "Comercio", color: "#f4b400", pdf: "pdfs/Reglamento_Comercio_Via_Publica_Pabellon.pdf" },
  espectaculos: { titulo: "Espectáculos y Diversiones Públicas", color: "#f4b400", pdf: "pdfs/Reglamento_Espectaculos_Festejos_Pabellon.pdf" },
  capapa: { titulo: "Comisión de Agua Potable y Alcantarillado (CAPAPA)", color: "#2e6ea6", pdf: "pdfs/Reglamento_CAPAPA_Pabellon.pdf" },
  servicios: { titulo: "Servicios Públicos Municipales", color: "#2f8f5b", pdf: "pdfs/Reglamento_Servicios_Publicos_Pabellon.pdf" },
  trabajo: { titulo: "Condiciones de Trabajo", color: "#2f8f5b", pdf: "pdfs/Reglamento_Condiciones_Trabajo_Pabellon.pdf" },
};

const params = new URLSearchParams(location.search);
const docId = params.get("doc") || "";
const hashArt = location.hash.replace(/^#art-/, "");

function numArticulo(a) {
  const n = parseFloat(String(a.articulo).replace(",", "."));
  return Number.isFinite(n) ? n : 999999;
}

function slugArt(n) {
  return String(n).replace(/[^\w.-]+/g, "-");
}

function normaliza(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function renderError(msg) {
  document.getElementById("tituloDoc").textContent = "Reglamento no encontrado";
  document.getElementById("contenido").innerHTML = `<div class="error">${msg}<br><br><a href="index.html">← Volver al inicio</a></div>`;
  document.getElementById("panelToc").style.display = "none";
}

function origenHtml(a) {
  const origen = Array.isArray(a.origen) ? a.origen : [];
  if (origen.length === 0) return "";

  const nums = origen.map((o) => escapeHtml(String(o.articulo_codigo)));
  let listaNums;
  if (nums.length === 1) listaNums = `Artículo ${nums[0]}`;
  else if (nums.length === 2) listaNums = `Artículos ${nums[0]} y ${nums[1]}`;
  else listaNums = `Artículos ${nums.slice(0, -1).join(", ")} y ${nums[nums.length - 1]}`;

  const bloques = origen.map((o) => `
      <div class="origen-bloque">
        <div class="cod-meta">Código Municipal 2024 — Artículo ${escapeHtml(String(o.articulo_codigo))}</div>
        <div class="origen-texto">${formatTextoLegal(o.texto || "")}</div>
      </div>`).join("");

  return `<aside class="origen-box">
      <p class="origen-label">📜 Origen: Código Municipal 2024, ${listaNums}</p>
      <details>
        <summary>Ver texto original</summary>
        ${bloques}
      </details>
      <a class="pdf-codigo" href="pdfs/Codigo_Municipal_v2024.pdf" target="_blank" rel="noopener">Ver PDF completo del Código →</a>
    </aside>`;
}

function formPanelHtml(a) {
  const id = slugArt(a.articulo);
  const artVal = escapeHtml(String(a.articulo));
  return `<div class="form-panel" hidden>
    <p class="form-panel-hint">Tu observación se envía al IMBIO y queda ligada a este artículo.</p>
    <p class="ctx"><strong>${escapeHtml(a.reglamento)}</strong> · Artículo ${artVal}</p>
    <div class="form-ok" hidden>Gracias. Tu observación fue enviada y será revisada por el IMBIO.</div>
    <form class="form-inline" data-art-form="${id}" data-reglamento="${escapeHtml(a.reglamento)}" data-articulo="${artVal}">
      <div>
        <label for="nombre_${id}">Nombre <span class="hint">(opcional)</span></label>
        <input type="text" id="nombre_${id}" name="nombre" autocomplete="name" maxlength="200" />
      </div>
      <div>
        <label for="contacto_${id}">Contacto <span class="hint">(correo o teléfono, opcional)</span></label>
        <input type="text" id="contacto_${id}" name="contacto" autocomplete="email" maxlength="200" />
      </div>
      <div>
        <label for="msg_${id}">Tu duda, comentario u observación</label>
        <textarea id="msg_${id}" name="comentario" required maxlength="5000" placeholder="Escribe aquí tu observación sobre este artículo…"></textarea>
      </div>
      <button type="submit">Enviar observación</button>
      <div class="form-err" hidden></div>
    </form>
  </div>`;
}

function toggleFormPanel(btn) {
  const art = btn.closest(".articulo");
  const panel = art.querySelector(".form-panel");
  const abierto = btn.getAttribute("aria-expanded") === "true";

  document.querySelectorAll(".articulo .form-panel").forEach((p) => {
    if (p !== panel) {
      p.hidden = true;
      const ok = p.querySelector(".form-ok");
      const f = p.querySelector(".form-inline");
      const err = p.querySelector(".form-err");
      if (ok && f) { ok.hidden = true; f.hidden = false; }
      if (err) { err.hidden = true; err.textContent = ""; }
    }
  });
  document.querySelectorAll(".articulo .btn-opinar").forEach((b) => {
    if (b !== btn) {
      b.setAttribute("aria-expanded", "false");
      b.textContent = BTN_OPINAR;
    }
  });

  if (abierto) {
    panel.hidden = true;
    btn.setAttribute("aria-expanded", "false");
    btn.textContent = BTN_OPINAR;
    return;
  }

  panel.hidden = false;
  btn.setAttribute("aria-expanded", "true");
  btn.textContent = "Ocultar formulario";
  setTimeout(() => panel.scrollIntoView({ behavior: "smooth", block: "nearest" }), 80);
}

async function onFormSubmit(e) {
  e.preventDefault();
  const form = e.target.closest(".form-inline");
  if (!form) return;
  const panel = form.closest(".form-panel");
  const err = form.querySelector(".form-err");
  const btn = form.querySelector('button[type="submit"]');
  const comentario = (form.querySelector('[name="comentario"]')?.value || "").trim();
  err.hidden = true;
  err.textContent = "";
  if (!comentario) {
    err.hidden = false;
    err.textContent = "Escribe tu duda, comentario u observación antes de enviar.";
    return;
  }
  const payload = {
    nombre: (form.querySelector('[name="nombre"]')?.value || "").trim(),
    contacto: (form.querySelector('[name="contacto"]')?.value || "").trim(),
    reglamento: form.dataset.reglamento || "",
    articulo: form.dataset.articulo || "",
    comentario,
  };
  btn.disabled = true;
  try {
    const resp = await fetch(OBSERVACIONES_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || !data.ok) throw new Error(data.error || "Error");
    form.hidden = true;
    panel.querySelector(".form-ok").hidden = false;
    panel.querySelector(".form-panel-hint").hidden = true;
    panel.querySelector(".ctx").hidden = true;
    panel.querySelector(".form-ok").textContent = data.mensaje || "Gracias, tu observación fue recibida.";
  } catch {
    err.hidden = false;
    err.textContent = "No pudimos enviar tu observación. Revisa tu conexión e intenta de nuevo en un momento.";
    btn.disabled = false;
  }
}

async function init() {
  const cat = CATALOGO[docId];
  if (!cat) {
    renderError("No se reconoce el documento solicitado. Elige un reglamento desde la página principal.");
    return;
  }

  document.getElementById("tituloDoc").textContent = cat.titulo;
  document.title = `${cat.titulo} — Lectura | IMBIO`;
  document.querySelector(".topbar").style.borderBottom = `3px solid ${cat.color}`;
  const linkPdf = document.getElementById("linkPdf");
  if (cat.pdf) {
    linkPdf.href = cat.pdf;
    linkPdf.hidden = false;
  } else {
    linkPdf.hidden = true;
  }

  let todos;
  try {
    const r = await fetch("data/articulos.json?v=bando20240824");
    todos = await r.json();
  } catch {
    renderError("No pude cargar el índice de artículos (data/articulos.json).");
    return;
  }

  const arts = todos.filter((a) => a.doc === docId).sort((a, b) => numArticulo(a) - numArticulo(b));
  if (arts.length === 0) {
    renderError("Este reglamento no tiene artículos en el índice.");
    return;
  }

  const nombreLegal = arts[0].reglamento;
  document.getElementById("metaDoc").textContent = `${arts.length} artículos · texto oficial`;

  const toc = document.getElementById("tocList");
  const cuerpo = document.getElementById("contenido");

  toc.innerHTML = arts.map((a) => {
    const id = slugArt(a.articulo);
    return `<li><a href="#art-${id}" data-art="${id}">Artículo ${escapeHtml(String(a.articulo))}</a></li>`;
  }).join("");

  cuerpo.innerHTML = `
    <p class="intro"><strong>${escapeHtml(nombreLegal)}</strong> — lectura continua con índice. El texto proviene del paquete normativo en consulta pública; no se ha alterado.</p>
    ${arts.map((a) => {
      const id = slugArt(a.articulo);
      return `<article class="articulo" id="art-${id}" data-art="${id}">
        <h3>Artículo ${escapeHtml(String(a.articulo))}</h3>
        <div class="texto">${formatTextoLegal(a.texto)}</div>
        ${origenHtml(a)}
        <button type="button" class="btn-opinar" aria-expanded="false">${BTN_OPINAR}</button>
        ${formPanelHtml(a)}
      </article>`;
    }).join("")}
  `;

  cuerpo.addEventListener("click", (e) => {
    const btn = e.target.closest(".btn-opinar");
    if (btn) toggleFormPanel(btn);
  });
  cuerpo.addEventListener("submit", onFormSubmit);

  if (hashArt) {
    const el = document.getElementById("art-" + hashArt);
    if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 100);
  }

  document.getElementById("buscaToc").addEventListener("input", (e) => {
    const q = normaliza(e.target.value.trim());
    const links = toc.querySelectorAll("a");
    const articles = cuerpo.querySelectorAll(".articulo");
    if (!q) {
      links.forEach((a) => { a.classList.remove("oculto"); });
      articles.forEach((art) => { art.classList.remove("oculto", "resaltado"); });
      return;
    }
    arts.forEach((a, i) => {
      const id = slugArt(a.articulo);
      const txt = normaliza(a.texto);
      const num = normaliza(String(a.articulo));
      const match = num.includes(q) || txt.includes(q);
      links[i].classList.toggle("oculto", !match);
      articles[i].classList.toggle("oculto", !match);
      articles[i].classList.toggle("resaltado", match);
    });
  });

  document.getElementById("btnToc").addEventListener("click", () => {
    const panel = document.getElementById("panelToc");
    const open = panel.classList.toggle("abierto");
    document.getElementById("btnToc").setAttribute("aria-expanded", open);
  });

  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) {
          const id = en.target.dataset.art;
          toc.querySelectorAll("a").forEach((a) => a.classList.toggle("activo", a.dataset.art === id));
        }
      });
    },
    { rootMargin: "-20% 0px -70% 0px", threshold: 0 }
  );
  cuerpo.querySelectorAll(".articulo").forEach((el) => observer.observe(el));
}

init();
</script>
</body>
</html>
